name: Build SOBONET APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Download Official Core Lib
        run: |
          mkdir -p V2rayNG/app/libs
          LATEST_AAR=$(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep "browser_download_url.*libv2ray.aar" | cut -d : -f 2,3 | tr -d '"[:space:]')
          if [ -z "$LATEST_AAR" ]; then
            LATEST_AAR="https://github.com/2dust/AndroidLibXrayLite/releases/download/v25.3.6/libv2ray.aar"
          fi
          curl -L -o V2rayNG/app/libs/libv2ray.aar "$LATEST_AAR"
          ls -lh V2rayNG/app/libs/

      - name: Build APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidRelease --no-daemon

      - name: Upload SOBONET APK
        uses: actions/upload-artifact@v4
        with:
          name: SOBONET-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/release/*.apk
