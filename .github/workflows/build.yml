name: Build SOBONET APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Inject Core and Assets
        run: |
          mkdir -p V2rayNG/app/libs
          mkdir -p V2rayNG/app/src/main/assets
          
          # استخراج خودکار آدرس آخرین فایل AAR منتشر شده بدون ریسک ۴۰۴
          CORE_URL=$(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases | grep "browser_download_url.*\.aar" | head -n 1 | cut -d '"' -f 4)
          echo "Found Core URL: $CORE_URL"
          curl -L -f -o V2rayNG/app/libs/libv2ray.aar "$CORE_URL"
          
          # دانلود فایل‌های روتینگ
          curl -L -o V2rayNG/app/src/main/assets/geoip.dat "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
          curl -L -o V2rayNG/app/src/main/assets/geosite.dat "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
          
          ls -lh V2rayNG/app/libs/
          ls -lh V2rayNG/app/src/main/assets/

      - name: Build Signed APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidRelease --no-daemon

      - name: Upload SOBONET APK
        uses: actions/upload-artifact@v4
        with:
          name: SOBONET-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/release/*.apk
