name: Build SOBONET APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Setup Valid libv2ray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          rm -rf tmp_extract
          mkdir -p tmp_extract/aar/jni
          cd tmp_extract

          # دانلود APK رسمی که هسته کامل در آن قرار دارد
          curl -L -o official.apk "https://github.com/2dust/v2rayNG/releases/download/1.9.29/v2rayNG_1.9.29_universal.apk"
          unzip -q official.apk

          # استخراج کتابخانه‌های بومی Go/Core
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -d "lib/$abi" ]; then
              mkdir -p "aar/jni/$abi"
              cp lib/$abi/libv2ray.so aar/jni/$abi/ 2>/dev/null || true
              cp lib/$abi/libtun2socks.so aar/jni/$abi/ 2>/dev/null || true
            fi
          done

          # تبدیل همه دکس‌ها به جار
          wget -q https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          unzip -q dex-tools-v2.4.zip
          chmod +x dex-tools-v2.4/d2j-dex2jar.sh

          mkdir -p all_classes
          for dex in classes*.dex; do
            ./dex-tools-v2.4/d2j-dex2jar.sh -f -o temp.jar "$dex" 2>/dev/null || true
            if [ -f temp.jar ]; then
              unzip -qo temp.jar -d all_classes/
              rm -f temp.jar
            fi
          done

          # بسته‌بندی کلاس‌های libv2ray
          mkdir -p aar_classes
          if [ -d "all_classes/libv2ray" ]; then
            cp -r all_classes/libv2ray aar_classes/
          else
            cp -r all_classes/* aar_classes/
          fi

          cd aar_classes
          jar cvf ../aar/classes.jar .
          cd ..

          # تعریف مانیفست
          cat << 'EOF' > aar/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="libv2ray" />
          EOF

          # ساخت AAR نهایی
          cd aar
          jar cvf ../libv2ray.aar .
          cd ..

          cp libv2ray.aar ../V2rayNG/app/libs/
          cd ..
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Build Signed APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidRelease --no-daemon

      - name: Upload SOBONET APK
        uses: actions/upload-artifact@v4
        with:
          name: SOBONET-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/release/*.apk
