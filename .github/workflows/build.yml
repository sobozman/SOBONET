name: Build SOBONET APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Fetch Official Native Core AAR
        run: |
          mkdir -p V2rayNG/app/libs
          # دریافت مستقیم فایل باینری رسمی که شامل پکیج go.Seq و تمام کلاس‌های CoreController است
          AAR_URL=$(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep "browser_download_url.*\.aar" | head -n 1 | cut -d '"' -f 4)
          if [ -z "$AAR_URL" ]; then
            AAR_URL="https://github.com/2dust/AndroidLibXrayLite/releases/download/v25.3.6/AndroidLibXrayLite.aar"
          fi
          echo "Downloading from: $AAR_URL"
          curl -L -f -o V2rayNG/app/libs/libv2ray.aar "$AAR_URL"
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Build Signed APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidRelease --no-daemon

      - name: Upload SOBONET APK
        uses: actions/upload-artifact@v4
        with:
          name: SOBONET-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/release/*.apk
