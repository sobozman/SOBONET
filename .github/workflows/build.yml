name: Build Sobonet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Download Prebuilt LibXray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          curl -L -f -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar || \
          curl -L -f -o V2rayNG/app/libs/libv2ray.aar https://github.com/hiddify/AndroidLibXrayLite/releases/latest/download/libv2ray.aar

      - name: Compile Hev Tunnel
        run: |
          export NDK_HOME=$ANDROID_NDK_HOME
          chmod +x compile-hevtun.sh
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -r libs/* V2rayNG/app/libs/ || true

      - name: Build APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-daemon

      - name: Upload SOBONET APK
        uses: actions/upload-artifact@v4
        with:
          name: SOBONET-Universal-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*universal*.apk
