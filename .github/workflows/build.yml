name: Build SOBONET APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Inject Core and Assets
        run: |
          mkdir -p V2rayNG/app/libs
          mkdir -p V2rayNG/app/src/main/assets
          
          # دانلود کتابخانه باینری هسته
          curl -L -f -o V2rayNG/app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/v25.3.6/AndroidLibXrayLite.aar"
          
          # فایل‌های ضروری دیتابیس روتینگ برای روشن ماندن پورت 10808
          curl -L -o V2rayNG/app/src/main/assets/geoip.dat "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
          curl -L -o V2rayNG/app/src/main/assets/geosite.dat "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
          
          # دریافت باینری تانل برای فعال‌سازی تونل VPN
          curl -L -o official.apk "https://github.com/2dust/v2rayNG/releases/download/1.9.29/v2rayNG_1.9.29_universal.apk"
          unzip -q official.apk -d extracted_official
          mkdir -p V2rayNG/app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -d "extracted_official/lib/$abi" ]; then
              mkdir -p "V2rayNG/app/src/main/jniLibs/$abi"
              cp extracted_official/lib/$abi/libhev*.so "V2rayNG/app/src/main/jniLibs/$abi/" 2>/dev/null || true
            fi
          done
          
          ls -lh V2rayNG/app/src/main/assets/

      - name: Build Signed APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidRelease --no-daemon

      - name: Upload SOBONET APK
        uses: actions/upload-artifact@v4
        with:
          name: SOBONET-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/release/*.apk
