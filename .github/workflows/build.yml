name: Build SOBONET APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Download Official Core AAR
        run: |
          mkdir -p V2rayNG/app/libs
          # دریافت نسخه جدید هسته که کلاس‌های CoreController و CoreCallbackHandler در آن قرار دارند
          curl -L -f -o V2rayNG/app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibCore/releases/latest/download/libv2ray.aar" || \
          curl -L -f -o V2rayNG/app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibCore/releases/download/v1.0.0/libv2ray.aar" || \
          curl -L -f -o V2rayNG/app/libs/libv2ray.aar "https://github.com/2dust/v2rayNG/releases/download/1.9.29/libv2ray.aar"
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Build Signed APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidRelease --no-daemon

      - name: Upload SOBONET APK
        uses: actions/upload-artifact@v4
        with:
          name: SOBONET-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/release/*.apk
