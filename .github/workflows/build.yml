name: Build SOBONET APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Extract Official Core From v2rayNG APK
        run: |
          mkdir -p V2rayNG/app/libs
          # دانلود فایل نصبی رسمی v2rayNG
          curl -L -o official.apk "https://github.com/2dust/v2rayNG/releases/download/1.9.29/v2rayNG_1.9.29_universal.apk"
          
          # استخراج تمام لایبرری‌های native هسته (libv2ray.so و ...)
          unzip -q official.apk -d extracted
          mkdir -p V2rayNG/app/src/main/jniLibs
          cp -r extracted/lib/* V2rayNG/app/src/main/jniLibs/
          
          # دانلود AAR رسمی پایه
          curl -L -o V2rayNG/app/libs/libv2ray.aar "https://raw.githubusercontent.com/2dust/AndroidLibXrayLite/master/libv2ray.aar" || true
          ls -lh V2rayNG/app/src/main/jniLibs/

      - name: Build Signed APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidRelease --no-daemon

      - name: Upload SOBONET APK
        uses: actions/upload-artifact@v4
        with:
          name: SOBONET-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/release/*.apk
